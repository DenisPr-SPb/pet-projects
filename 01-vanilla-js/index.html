<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vanilla-JS</title>
</head>
<body>
<div>
    <button id="btn" onclick="changeBtn()">Click</button>
</div>
<script>
    const btn = document.getElementById('btn');
    function changeBtn() {
        btn.innerText = 'Click NOW';
    }
</script>
</body>
</html>
