<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>React-H-W</title>
</head>
<body>
<div id="app"></div>
<div id="appJS" ></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script>
    const app = document.getElementById('app');
    const helloWorldHeading = React.createElement('h1', null, 'Hello World!');
    console.log(helloWorldHeading);
    const root = ReactDOM.createRoot(app);
    root.render(helloWorldHeading);
</script>
<script>
    const appJS = document.getElementById('appJS');
    const headingJS = document.createElement('h1');
    headingJS.textContent = 'Hello World JS!';
    console.log(headingJS);
    appJS.appendChild(headingJS);
</script>
</body>
</html>
